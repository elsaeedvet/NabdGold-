<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141832">
<meta name="description" content="نبض — متابعة حية لسعر الذهب والبيتكوين مع توصيات مبنية على تحليل فني وأساسي">
<title>نبض | تتبع الذهب والبيتكوين</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>📈</text></svg>">

<noscript></noscript>
<style>
:root{
  --bg: #141832;
  --surface: #1E2444;
  --surface-2: #272E54;
  --border: #3A4270;
  --text: #FFFFFF;
  --text-dim: #B0B8DC;
  --gold: #FFB020;
  --gold-glow: #FFCC4D;
  --btc: #FF8A3D;
  --bull: #00E68A;
  --bear: #FF3D6E;
  --neutral: #B0B8DC;
  --radius-lg: 18px;
  --radius-md: 12px;
  --font-display: "Segoe UI", Tahoma, Arial, sans-serif;
  --font-body: "Segoe UI", Tahoma, Arial, sans-serif;
  --font-mono: "Courier New", Courier, monospace;
}

*{ box-sizing: border-box; }

html, body{
  margin:0; padding:0;
  background:
    radial-gradient(ellipse at 20% -10%, rgba(255,176,32,.14), transparent 45%),
    radial-gradient(ellipse at 100% 0%, rgba(0,230,138,.10), transparent 40%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}

body{
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}

#app{
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px 32px;
}

h1,h2,h3{ font-family: var(--font-display); margin:0; }

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 2px 10px;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-icon-text{ font-size:26px; line-height:1; }
.brand h1{ font-size: 21px; font-weight:800; letter-spacing: .5px; }
.icon-btn{
  background: var(--surface); border:1px solid var(--border);
  color: var(--text-dim); width:40px; height:40px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition: color .15s, border-color .15s;
}
.icon-btn:hover{ color: var(--gold); border-color: var(--gold); }

/* ---------- asset tabs ---------- */
.asset-label-badge{
  display:flex; align-items:center; gap:8px; justify-content:center;
  padding:10px 14px; margin-bottom:14px; border-radius:12px;
  background: linear-gradient(135deg, rgba(255,176,32,.28), rgba(255,176,32,.06));
  border:1px solid var(--gold); color: var(--gold-glow);
  font-weight:800; font-size:13.5px;
  box-shadow: 0 0 20px rgba(255,176,32,.2);
}
.asset-tabs{
  display:flex; gap:8px; padding: 4px 2px 18px;
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding: 10px 8px; border-radius: var(--radius-md);
  background: var(--surface); border:1px solid var(--border);
  color: var(--text-dim); cursor:pointer;
  font-family: var(--font-body); transition: all .18s ease;
}
.tab-name{ font-size:14px; font-weight:600; }
.tab-sym{ font-family: var(--font-mono); font-size:11px; letter-spacing:1px; opacity:.7; }
.tab.active{
  background: linear-gradient(180deg, rgba(201,162,75,.16), rgba(201,162,75,.04));
  border-color: var(--gold);
  color: var(--gold-glow);
}
.tab[data-asset="btc"].active{
  background: linear-gradient(180deg, rgba(240,162,62,.16), rgba(240,162,62,.04));
  border-color: var(--btc);
  color: var(--btc);
}

/* ---------- price hero ---------- */
.price-hero{
  background: var(--surface);
  border:1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 18px 6px;
  margin-bottom: 14px;
}
.price-top{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px; }
.price-main{ display:flex; align-items:baseline; gap:10px; }
.price-value{
  font-family: var(--font-mono); font-size: 30px; font-weight:700;
  font-variant-numeric: tabular-nums;
  color: var(--gold-glow);
  text-shadow: 0 0 18px rgba(255,204,77,.35);
}
.price-change{ font-family: var(--font-mono); font-size:14px; font-weight:700; }
.price-change.up{ color: var(--bull); }
.price-change.down{ color: var(--bear); }
.price-meta{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.price-source{ font-size:11px; color: var(--text-dim); }
.price-updated{ font-size:11px; color: var(--text-dim); font-family: var(--font-mono); }
.price-chart{ width:100%; height:120px; display:block; }

/* ---------- conviction card (signature element) ---------- */
.conviction-card{
  background: var(--surface);
  border:1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px 18px;
  margin-bottom: 14px;
}
.conviction-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.conviction-label{ font-size:13px; color: var(--text-dim); font-weight:600; }
.rec-badge{
  font-family: var(--font-display); font-weight:800; font-size:14px;
  padding: 5px 14px; border-radius: 999px;
  border:1px solid var(--border);
}
.rec-neutral{ color: var(--neutral); border-color: var(--border); }
.rec-buy{ color: var(--bull); border-color: var(--bull); background: rgba(0,230,138,.14); box-shadow: 0 0 16px rgba(0,230,138,.25); }
.rec-strong-buy{ color: #061014; background: var(--bull); border-color: var(--bull); box-shadow: 0 0 22px rgba(0,230,138,.55); }
.rec-sell{ color: var(--bear); border-color: var(--bear); background: rgba(255,61,110,.14); box-shadow: 0 0 16px rgba(255,61,110,.25); }
.rec-strong-sell{ color: #1a0208; background: var(--bear); border-color: var(--bear); box-shadow: 0 0 22px rgba(255,61,110,.55); }

.gauge-track{
  position:relative; height:10px; border-radius:6px;
  background: linear-gradient(90deg, var(--bear), var(--surface-2) 35%, var(--surface-2) 65%, var(--bull));
  overflow:visible;
}
.gauge-needle{
  position:absolute; top:-5px; width:4px; height:20px; border-radius:2px;
  background: var(--text); box-shadow: 0 0 0 3px var(--bg), 0 0 8px rgba(0,0,0,.4);
  transform: translateX(50%);
  transition: right .4s ease;
}
.gauge-labels{ display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color: var(--text-dim); }

/* ---------- probability badge ---------- */
.probability-badge{
  margin-top:14px; padding:11px 14px; border-radius:12px; text-align:center;
  font-size:14px; font-weight:700;
}
.probability-badge.hidden{ display:none; }
.probability-badge strong{ font-size:17px; }
.prob-confluence{ font-size:11.5px; font-weight:500; opacity:.85; }
.prob-buy{ background: linear-gradient(90deg, rgba(0,230,138,.28), rgba(0,230,138,.08)); border:1px solid var(--bull); color: var(--bull); box-shadow: 0 0 18px rgba(0,230,138,.25); }
.prob-sell{ background: linear-gradient(90deg, rgba(255,61,110,.28), rgba(255,61,110,.08)); border:1px solid var(--bear); color: var(--bear); box-shadow: 0 0 18px rgba(255,61,110,.25); }
.prob-neutral{ background: var(--surface-2); border:1px solid var(--border); color: var(--text-dim); }

/* ---------- fundamental card ---------- */
.fundamental-card{
  background: linear-gradient(135deg, rgba(255,176,32,.14), var(--surface));
  border:1px solid var(--gold); border-radius: var(--radius-lg);
  padding: 16px 18px; margin-bottom:14px;
  box-shadow: 0 0 24px rgba(255,176,32,.1);
}
.fundamental-card h2{ font-size:15px; margin-bottom:8px; color: var(--gold-glow); }
.fundamental-note{ font-size:13px; line-height:1.7; color: var(--text); margin:0; }

/* ---------- frozen note ---------- */
.tl-frozen-note{ font-size:11px; color: var(--text-dim); text-align:center; margin:8px 0 0; line-height:1.5; }

/* ---------- candle visual ---------- */
.candle-visual-row{ display:flex; align-items:center; gap:14px; }
.candle-svg-box{
  flex-shrink:0; background: var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:6px; display:flex; align-items:center; justify-content:center;
}
.candle-svg{ width:88px; height:66px; display:block; }
.candle-timeframe-tag{
  display:inline-block; font-size:10.5px; color: var(--gold-glow);
  background: rgba(244,185,66,.12); border:1px solid var(--gold);
  padding:2px 8px; border-radius:6px; margin:4px 0; width:fit-content;
}

/* ---------- chart pattern box ---------- */
.chart-pattern-box{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px; border-radius: var(--radius-md); background: var(--surface-2);
}
.chart-pattern-box.hidden{ display:none; }
.chart-pattern-box.bull{ border:1px solid var(--bull); }
.chart-pattern-box.bear{ border:1px solid var(--bear); }
.chart-pattern-box.neutral{ border:1px solid var(--border); }
.chart-pattern-info{ display:flex; flex-direction:column; gap:4px; }

/* ---------- reasons ---------- */
.reasons-card{
  background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom:14px;
}
.reasons-card h2{ font-size:15px; margin-bottom:10px; }
.reasons-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
.reasons-list li{
  font-size:13.5px; line-height:1.6; padding-right:16px; position:relative; color: var(--text);
}
.reasons-list li::before{
  content:""; position:absolute; right:0; top:7px; width:7px; height:7px; border-radius:50%;
}
.reasons-list li.bull::before{ background: var(--bull); }
.reasons-list li.bear::before{ background: var(--bear); }
.reasons-list li.neutral::before{ background: var(--neutral); }
.reason-placeholder{ color: var(--text-dim); }

/* ---------- indicator grid ---------- */
.indicator-grid{
  display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:14px;
}
.indicator-card{
  background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius-md); padding:14px;
}
.indicator-card.span-2{ grid-column: 1 / -1; }
.indicator-card h3{
  font-size:12.5px; font-weight:700; color: var(--text-dim);
  display:flex; align-items:baseline; gap:6px; margin-bottom:10px;
}
.ind-sub{ font-family: var(--font-mono); font-size:10px; opacity:.7; }
.ind-value{ margin-inline-start:auto; font-family: var(--font-mono); font-size:13px; color: var(--text); font-weight:600; }
.ind-note{ font-size:12px; color: var(--text-dim); margin: 8px 0 0; line-height:1.5; }

.mini-gauge-track{
  position:relative; height:8px; border-radius:5px; display:flex; overflow:hidden;
}
.mini-gauge-zone{ height:100%; }
.zone-low{ width:30%; background: rgba(229,91,91,.55); }
.zone-mid{ width:40%; background: var(--surface-2); }
.zone-high{ width:30%; background: rgba(229,91,91,.55); }
.mini-gauge-marker{
  position:absolute; top:-4px; width:3px; height:16px; border-radius:2px;
  background: var(--text); transform: translateX(50%); transition: right .4s ease;
}
.mini-gauge-scale{
  display:flex; justify-content:space-between; font-family: var(--font-mono);
  font-size:10px; color: var(--text-dim); margin-top:6px;
}

.macd-chart{ width:100%; height:64px; display:block; }

.level-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.level-item{
  display:flex; align-items:center; justify-content:space-between;
  font-family: var(--font-mono); font-size:12px; padding:6px 8px;
  border-radius:8px; background: var(--surface-2);
}
.level-item.level-near{ outline: 1px solid var(--gold); background: rgba(201,162,75,.10); }
.level-pct{ color: var(--text-dim); }
.level-price{ font-weight:600; }
.level-tag{ font-family: var(--font-body); font-size:11px; padding:2px 7px; border-radius:6px; }
.level-res .level-tag{ background: rgba(229,91,91,.18); color: var(--bear); }
.level-sup .level-tag{ background: rgba(52,199,150,.18); color: var(--bull); }
.level-strength{ color: var(--text-dim); font-size:10px; }

.candle-pattern{
  display:flex; align-items:center; justify-content:center;
  padding: 18px 10px; border-radius: var(--radius-md);
  background: var(--surface-2);
}
.candle-pattern-name{ font-size:16px; font-weight:700; font-family: var(--font-display); }
.candle-pattern.bull .candle-pattern-name{ color: var(--bull); }
.candle-pattern.bear .candle-pattern-name{ color: var(--bear); }
.candle-pattern.neutral .candle-pattern-name{ color: var(--text-dim); }

/* ---------- trade levels ---------- */
.reasons-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.reasons-header h2{ margin-bottom:0; font-size:15px; }
.analysis-time{ font-size:11px; color: var(--text-dim); font-family: var(--font-mono); }
.reanalyze-btn{
  width:100%; margin-top:14px; padding:11px; border-radius:12px;
  background: var(--surface-2); border:1px dashed var(--border);
  color: var(--text-dim); font-family: var(--font-body); font-size:13px;
  font-weight:600; cursor:pointer; transition: border-color .15s, color .15s;
}
.reanalyze-btn:hover{ border-color: var(--gold); color: var(--gold-glow); }
.trade-levels{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.trade-levels.hidden{ display:none; }
.trade-level-row{ display:flex; gap:8px; }
.trade-level-box{
  flex:1; display:flex; flex-direction:column; gap:3px;
  padding:10px 12px; border-radius:12px; background: var(--surface-2);
}
.tl-entry{ border-right:3px solid var(--gold); box-shadow: inset 0 0 12px rgba(255,176,32,.08); }
.tl-stop{ border-right:3px solid var(--bear); box-shadow: inset 0 0 12px rgba(255,61,110,.08); }
.tl-tp1{ border-right:3px solid var(--bull); box-shadow: inset 0 0 12px rgba(0,230,138,.08); }
.tl-tp2{ border-right:3px solid rgba(0,230,138,.5); box-shadow: inset 0 0 12px rgba(0,230,138,.06); }
.tl-label{ font-size:11px; color: var(--text-dim); font-weight:600; }
.tl-value{ font-family: var(--font-mono); font-size:14px; font-weight:700; }
.tl-entry .tl-value{ color: var(--gold-glow); }
.tl-stop .tl-value{ color: var(--bear); }
.tl-tp1 .tl-value, .tl-tp2 .tl-value{ color: var(--bull); }
.tl-pct{ font-family: var(--font-mono); font-size:11px; color: var(--bull); }
.tl-rr{
  font-size:12px; color: var(--text-dim); text-align:center;
  margin:2px 0 0; padding:8px; border-radius:10px; background: var(--surface-2);
}
.tl-rr strong{ color: var(--text); }

/* ---------- candle pattern updated ---------- */
.candle-pattern{
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 14px; border-radius: var(--radius-md);
  background: var(--surface-2); gap:10px;
}
.candle-pattern-info{ display:flex; flex-direction:column; gap:4px; }
.candle-pattern-name{ font-size:15px; font-weight:700; font-family: var(--font-display); }
.candle-pattern.bull .candle-pattern-name{ color: var(--bull); }
.candle-pattern.bear .candle-pattern-name{ color: var(--bear); }
.candle-pattern.neutral .candle-pattern-name{ color: var(--text-dim); }
.candle-pattern-desc{ font-size:12px; color: var(--text-dim); line-height:1.4; }
.candle-signal-badge{
  flex-shrink:0; font-family: var(--font-display); font-weight:800;
  font-size:13px; padding:6px 14px; border-radius:999px; white-space:nowrap;
}
.candle-pattern.bull .candle-signal-badge{ background: rgba(52,199,150,.15); color: var(--bull); border:1px solid var(--bull); }
.candle-pattern.bear .candle-signal-badge{ background: rgba(229,91,91,.15); color: var(--bear); border:1px solid var(--bear); }
.candle-pattern.neutral .candle-signal-badge{ background: var(--surface); color: var(--text-dim); border:1px solid var(--border); }

/* ---------- news impact badges ---------- */
.news-impact{ display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; }
.impact-badge{
  font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px;
}
.impact-gold-pos{ background: rgba(201,162,75,.18); color: var(--gold-glow); }
.impact-gold-neg{ background: rgba(229,91,91,.15); color: var(--bear); }
.impact-gold-neu{ background: var(--surface-2); color: var(--text-dim); }
.impact-usd-pos{ background: rgba(52,199,150,.12); color: var(--bull); }
.impact-usd-neg{ background: rgba(229,91,91,.12); color: var(--bear); }
.impact-usd-neu{ background: var(--surface-2); color: var(--text-dim); }

/* ---------- economic calendar ---------- */
.calendar-card{
  background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius-lg); padding:16px 18px; margin-bottom:14px;
}
.calendar-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.calendar-header h2{ font-size:15px; margin:0; }
.notif-btn{
  background: var(--surface-2); border:1px solid var(--border);
  border-radius:10px; padding:6px 10px; font-size:16px; cursor:pointer;
  transition: border-color .15s;
}
.notif-btn:hover{ border-color: var(--gold); }
.notif-status{ font-size:11px; color: var(--text-dim); margin:0 0 10px; min-height:14px; }
.calendar-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }

.cal-event{
  border-radius:14px; overflow:hidden;
  border:1px solid var(--border); background: var(--surface-2);
}
.cal-event.impact-high{ border-right:4px solid var(--bear); }
.cal-event.impact-medium{ border-right:4px solid var(--gold); }
.cal-event.cal-upcoming{ border-right:4px solid var(--btc); }
.cal-event.cal-countdown{ border-right:4px solid #9B7FFF; }

.cal-event-top{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 12px 6px; gap:8px;
}
.cal-status-dot{
  width:10px; height:10px; border-radius:50%; flex-shrink:0;
}
.cal-status-dot.released{ background: var(--bear); box-shadow:0 0 6px var(--bear); }
.cal-status-dot.upcoming{ background: var(--btc); animation: pulse-dot 1.4s infinite; }
.cal-status-dot.soon{ background: #9B7FFF; animation: pulse-dot .8s infinite; }
@keyframes pulse-dot{
  0%,100%{ opacity:1; } 50%{ opacity:.35; }
}
.cal-event-name{
  flex:1; font-size:13.5px; font-weight:700; font-family: var(--font-display); line-height:1.3;
}
.cal-event-time{ font-family: var(--font-mono); font-size:11px; color: var(--text-dim); white-space:nowrap; }
.cal-bulls-row{ display:flex; align-items:center; gap:8px; padding:0 12px 8px; }
.cal-bulls{ font-size:14px; letter-spacing:2px; }
.cal-bulls-label{ font-size:11px; color: var(--text-dim); }

.cal-countdown-bar{
  margin:0 12px 8px; font-size:12px; font-weight:600; color:#9B7FFF;
  padding:5px 10px; border-radius:8px; background: rgba(155,127,255,.1);
  text-align:center;
}

.cal-values{
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;
  padding:0 12px 10px;
}
.cal-val-box{ display:flex; flex-direction:column; align-items:center; gap:2px; }
.cal-val-label{ font-size:10px; color: var(--text-dim); font-weight:600; }
.cal-val-num{
  font-family: var(--font-mono); font-size:13px; font-weight:700;
  padding:4px 8px; border-radius:8px; background: var(--surface); min-width:52px; text-align:center;
}
.cal-val-num.actual-beat{ color: var(--bull); background: rgba(52,199,150,.12); }
.cal-val-num.actual-miss{ color: var(--bear); background: rgba(229,91,91,.12); }
.cal-val-num.actual-inline{ color: var(--text-dim); }
.cal-val-num.no-data{ color: var(--text-dim); opacity:.5; }

.cal-impact-row{
  display:flex; gap:8px; padding:8px 12px; border-top:1px solid var(--border); flex-wrap:wrap;
}
.cal-impact-label{ font-size:11px; font-weight:600; padding:3px 10px; border-radius:8px; }
.cal-verdict{ font-size:12px; color: var(--text-dim); padding:8px 12px; border-top:1px solid var(--border); line-height:1.5; }

/* ---------- news ---------- */
.news-card{
  background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius-lg); padding:16px 18px; margin-bottom:14px;
}
.news-card h2{ font-size:15px; margin-bottom:10px; }
.news-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
.news-item a{
  color: var(--text); text-decoration:none; font-size:13.5px; line-height:1.5; font-weight:500;
}
.news-item a:hover{ color: var(--gold-glow); }
.news-meta{ display:flex; gap:10px; margin-top:3px; font-size:11px; color: var(--text-dim); }
.news-loading, .news-erro
